.open-card{position:relative;width:min(560px,90vw);padding:38px 24px;text-align:center;border:1px solid #fff;border-radius:30px;background:#ffffffdf;backdrop-filter:blur(12px);box-shadow:0 22px 70px #174d8230}
.eyebrow{font:11px Arial,sans-serif;letter-spacing:3px;color:#174d82}
.rings{font-size:42px;margin:16px 0 4px}
.open-card h1{font-size:54px;font-weight:400;margin:4px 0;color:#123f76}
.open-card p{font:14px Arial,sans-serif;letter-spacing:1px;color:#55728e}
.open-btn{border:0;border-radius:30px;padding:14px 27px;background:#4f89b8;color:#fff;letter-spacing:1.4px;cursor:pointer;box-shadow:0 12px 25px #376f9830}
.opening.hide{animation:close .8s forwards}
@keyframes close{to{opacity:0;visibility:hidden;transform:scale(1.03)}}
.page{min-height:100vh;padding:28px 10px 60px}
.invite{position:relative;width:min(900px,100%);margin:auto;border-radius:26px;overflow:hidden;box-shadow:0 20px 70px #174d8230;background:#fff}
.invite img{display:block;width:100%;height:auto}
/* Invisible functional zones over the design image */
.zone{position:absolute;display:block;z-index:4;border-radius:20px}
.zone-map{left:48%;top:69%;width:45%;height:5.2%}
.zone-rsvp{left:34%;top:80.5%;width:34%;height:5%}
.zone-open{left:36%;top:29%;width:28%;height:5%}
.guest-cover{position:absolute;z-index:5;left:31%;top:7.0%;width:38%;height:5.0%;display:flex;align-items:center;justify-content:center;text-align:center;background:rgba(255,255,255,.94);border-radius:18px;color:#174d82;font:clamp(24px,4.4vw,44px) Georgia,"Times New Roman",serif}
.guest-cover small{display:block;font:8px Arial,sans-serif;letter-spacing:2px;margin-bottom:2px}
.extra{width:min(900px,100%);margin:22px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.extra a{display:block;text-align:center;padding:14px;border-radius:20px;background:#fff;border:1px solid #d7e9f3;font:12px Arial,sans-serif;letter-spacing:1px;color:#174d82;box-shadow:0 10px 25px #174d8212}
.note{width:min(900px,100%);margin:16px auto 0;text-align:center;font:11px Arial,sans-serif;line-height:1.7;color:#668099}
@media(max-width:600px){
 .page{padding:12px 5px 35px}
 .invite{border-radius:18px}
 .extra{grid-template-columns:1fr}
 .guest-cover{font-size:25px}
 .zone-map{left:47%;top:69%;width:47%;height:5.2%}
 .zone-rsvp{left:31%;top:80.5%;width:38%;height:5%}
}
